name: Refresh company data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-company-data.yml'
      - 'pipeline/company_catalog.py'
      - 'pipeline/refresh_catalog.py'
      - 'pipeline/fetch_efficiency.py'
      - 'pipeline/fetch_job_samples.py'
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: company-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@v4
        with:
          path: pipeline/.cache/efficiency
          key: company-sources-${{ github.run_id }}
          restore-keys: company-sources-
      - run: npm ci
      - name: Discover companies and refresh oldest batch
        run: npm run data:refresh -- --batch-size 40
      - name: Validate data and game
        run: |
          npm run test:data
          npm run test:game
          npx tsc --noEmit
      - name: Save refresh report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: company-refresh-report
          path: |
            pipeline/data/refresh_status.json
            pipeline/data/discovery_state.json
            pipeline/data/efficiency_coverage.json
      - name: Publish refreshed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pipeline/data/company_catalog.json pipeline/data/discovered_reports.json pipeline/data/discovery_state.json pipeline/data/refresh_status.json pipeline/data/financial_facts.json pipeline/data/job_samples.json pipeline/data/efficiency_coverage.json src/data/game_companies.json src/data/efficiency.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh discovered company data'
          git pull --rebase origin main
          git push origin HEAD:main
